services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tescon_app
    ports:
      - "5432:5432"
    volumes:
      - tescon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tescon_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tescon_postgres_data:
